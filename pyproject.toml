[project]
name = "pyslackersweb"
version = "0.1.0"
description = "The website for the pythondev.slack.com community"
requires-python = ">=3.12"
dependencies = [
    # Web Framework
    "aiohttp==3.10.11",
    "aiohttp-jinja2==1.5",
    "aiohttp-oauth2==0.0.3",
    "aiohttp-remotes==1.0.0",
    # Database
    "asyncpgsa==0.27.1",
    "sqlalchemy==1.3.23",  # Limited by asyncpgsa compatibility (no SQLAlchemy 1.4+ support)
    "psycopg2-binary==2.9.10",
    "alembic==1.5.8",
    # Cache/Redis
    "aioredis==1.3.1",
    # Task Scheduling
    "apscheduler>=3.10.0",
    # Slack Integration
    "slack-sansio>=1.1.0",
    # Server
    "gunicorn>=22.0.0",
    "uvloop==0.21.0",
    # Utilities
    "marshmallow==3.22.0",
    "sentry-sdk==2.37.1",
    "pyyaml==6.0.2",
    "urllib3<2.0",
]

[dependency-groups]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.1.0",
    "pytest-aiohttp>=1.0.4",
    "pytest-asyncio>=0.23.5",
]
lint = [
    "pre-commit>=4.3.0",
    "ruff>=0.13.0",
]
typing = [
    "mypy>=1.8.0",
    "types-pyyaml>=6.0.12.20241230",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "typing" },
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope="function"

[tool.ruff]
extend-exclude = [".env", "migrations", "tests"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
preview = true
select = [
    "A", # Flake8-builtins
    "E", # pycodestyle (equivalent of Flake8 base)
    "F", # pyflakes (equivalent of Flake8 base)
    "W", # pycodestyle (equivalent of Flake8 base)
]
